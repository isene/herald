    <line x1="72" y1="128" x2="150" y2="128" stroke="#f74c00" opacity="0.7"/>
    <line x1="72" y1="172" x2="170" y2="172" stroke="#ffb066"/>
  </g>

  <circle cx="128" cy="128" r="124" fill="none" stroke="#f74c00" stroke-width="3" stroke-opacity=".9"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#ffb066" stroke-width="1" stroke-opacity=".5"/>
