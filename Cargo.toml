[package]
name = "herald"
version = "0.1.1"
edition = "2021"
description = "Desktop notifications: small boxes at the top right, and nothing running while none arrive"
license = "Unlicense"
repository = "https://github.com/isene/herald"
authors = ["Geir Isene <g@isene.com>"]

[dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
x11rb = { version = "0.13", default-features = false }
ab_glyph = "0.2"
# 1.7 keeps an idle helper thread forever, waking it twice a second;
# 1.6 lets it go after half a second. zbus pulls it in.
blocking = "=1.6.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
